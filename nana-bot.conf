[program:nana-bot]
command=/home/vito/nana-bot/venv/bin/python main.py
directory=/home/vito/nana-bot
user=vito
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=10
stopsignal=INT
redirect_stderr=true
stdout_logfile=/home/vito/nana-bot/logs/nana-bot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
# 2026-08-04: 曾嘗試設 DISCORD_DISABLE_DAVE="1" 宣告 DAVE 版本 0 以繞過
# 不穩定的 E2EE 接收，但 Discord 直接以 **4017** 拒絕連線 ——
# 語音 E2EE 已是強制的，不能降級。開關保留在 dependencies.py 但不要開啟。
environment=HOME="/home/vito",PATH="/home/vito/nana-bot/venv/bin:%(ENV_PATH)s"
